name: Update pnpm lockfile after PageSmith
on:
  push:
    branches: [ main ]

jobs:
  update-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm 10.11.1
        uses: pnpm/action-setup@v6
        with:
          version: 10.11.1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate pnpm‑lock.yaml
        run: pnpm install --no-frozen-lockfile

      - name: Commit & push updated lockfile
        run: |
          git config --global user.name "PageSmith Auto Bot"
          git config --global user.email "bot@speoc.com"
          git add pnpm-lock.yaml
          if [[ -n $(git status --porcelain pnpm-lock.yaml) ]]; then
            git commit -m "🤖 Auto‑sync pnpm‑lock.yaml for PageSmith changes"
            git push
          fi
